spring.application.name=helpdesk
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/helpdesk;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
# Trocar obrigatoriamente em qualquer instalacao real (minimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:chave-apenas-para-estudo-altere-antes-de-publicar-123456789}
app.jwt.hours=8
